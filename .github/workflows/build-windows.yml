name: Build & Release (Windows x64 & macOS arm64)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build native Windows executable
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Run self-test diagnostics
        shell: pwsh
        run: ./dist/AntigravityAssistant.exe --self-test

      - name: Package Windows x64 archive
        shell: pwsh
        run: |
          Compress-Archive -Path ./dist/AntigravityAssistant.exe, ./README.md, ./README.en.md, ./CONFIG.md, ./CONFIG.en.md, ./LICENSE -DestinationPath ./dist/AntigravityAssistant-windows-x64.zip -Force

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityAssistant-windows-x64
          path: ./dist/AntigravityAssistant-windows-x64.zip

  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build native macOS app bundle
        run: |
          chmod +x ./scripts/build_app.sh
          ./scripts/build_app.sh

      - name: Package macOS arm64 archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent ./dist/AntigravityAssistant.app ./dist/AntigravityAssistant-macos-arm64.zip

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityAssistant-macos-arm64
          path: ./dist/AntigravityAssistant-macos-arm64.zip

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-windows, build-macos ]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ### 🪟 Windows (10 / 11 x64) & 🍎 macOS (14.0+ arm64) Dual-Platform Release

            - **Windows (`AntigravityAssistant-windows-x64.zip`)**: Native `WPF + Win32 + UI Automation + winsqlite3.dll` single-file executable (`~300 KB`, zero external runtime required), featuring built-in Google Code Assist OAuth PKCE live `5h / 7d` quota sync (`Gemini` & `Claude/GPT`), Magpie gateway compatibility, PerMonitorV2 click-through pixel mascot, `Alt+A` global hotkey, and synchronized UI Automation session jump & delete.
            - **macOS (`AntigravityAssistant-macos-arm64.zip`)**: Native `SwiftUI + AppKit` floating mascot & menu bar assistant with direct local Antigravity quota sync and reliable cross-app session navigation.
          files: |
            release-assets/AntigravityAssistant-windows-x64.zip
            release-assets/AntigravityAssistant-macos-arm64.zip
